<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 チェック 呼び出し</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1>
        <span class="code">プログラミング演習1 (F1)</span>チェック呼び出し
      </h1>
      <button id="infoButton" aria-label="学籍番号の扱いについて">i</button>
      <a
        class="repo"
        href="https://github.com/frinfo702/check-prog"
        target="_blank"
        rel="noopener"
        title="GitHub リポジトリ"
        aria-label="GitHub リポジトリ"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
      </a>
    </header>

    <div class="layout">
      <main class="plan">
        <div class="plan-head">
          <span class="wall-label">窓側</span>
          <span class="legend">
            <i class="swatch q"></i>質問 <i class="swatch c"></i>チェック
          </span>
        </div>

        <div class="window-bar" aria-hidden="true"></div>

        <div class="map-scroll">
          <div id="map" class="map" aria-label="座席表"></div>
        </div>

        <div class="corridor">
          <span class="wall-label">廊下側</span>
          <span class="ta">TA席</span>
        </div>
      </main>

      <aside class="rail">
        <form id="idForm" class="card">
          <label for="sid">学籍番号</label>
          <input
            id="sid"
            inputmode="numeric"
            autocomplete="off"
            placeholder="26002123456"
          />
          <button type="submit">自分の席を表示</button>
        </form>

        <p id="err" class="err" role="alert"></p>

        <div id="me" class="card" hidden>
          <p class="seat-label">あなたの席</p>
          <p class="seat">
            <strong id="myDesk"></strong><span id="mySide" class="side"></span>
          </p>

          <div class="actions">
            <button id="raiseQuestion" class="q">質問で呼ぶ</button>
            <button id="raiseCheck" class="c">チェックで呼ぶ</button>
            <button id="withdraw" class="ghost">取り下げ</button>
          </div>

          <p id="status" class="status"></p>
          <button id="reset" class="link">学籍番号を入力し直す</button>
        </div>
      </aside>
    </div>

    <dialog id="infoDialog">
      <h2>学籍番号の扱い</h2>
      <ul>
        <li>
          学籍番号は、あなたの席を照合するためだけに使います。サーバーには保存しません。
        </li>
        <li>他の学生に、あなたの学籍番号が見えることはありません。</li>
        <li>
          学籍番号はMoodleから取得したもので、この授業の運営以外には使用しません。
        </li>
        <li>
          入力した学籍番号は、このブラウザの中に暗号化して保存され、次回の入力が不要になります。
        </li>
      </ul>
      <button id="infoClose">閉じる</button>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
